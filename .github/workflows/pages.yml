name: Refresh holdings and deploy

on:
  push:
    branches: [main]
  # Daily holdings refresh is paused (shelf counts are hidden on the page for now).
  # To resume: uncomment the schedule and build with --counts in deploy.py and below.
  # schedule:
  #   - cron: "0 22 * * *"   # 06:00 Asia/Taipei
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: tools/.cache
          key: typl-search-${{ github.run_id }}
          restore-keys: typl-search-
      - name: Refresh Taoyuan library holdings
        run: python3 tools/holdings.py tools/books.json tools/books-2023-2024.json tools/books-0-3.json --refresh --out tools/holdings.json
      - name: Rebuild page
        run: python3 tools/build.py --wrap --out index.html
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/holdings.json index.html
          git diff --cached --quiet && echo "no changes" || (git commit -m "Refresh holdings $(date -u +%F)" && git push)

  deploy:
    needs: refresh
    if: ${{ !cancelled() && (needs.refresh.result == 'success' || needs.refresh.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html covers robots.txt .nojekyll _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
